[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentaurus-bridge-lite"
version = "0.1.0"
description = "Portable VS Code friendly SSH bridge for running Synopsys Sentaurus TCAD on a remote VM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "sentaurus-bridge-lite contributors"}
]
keywords = ["sentaurus", "tcad", "vscode", "ssh", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
sentaurus-bridge = "sentaurus_bridge.cli:main"
sbridge = "sentaurus_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentaurus_bridge = ["resources/.env.example"]
