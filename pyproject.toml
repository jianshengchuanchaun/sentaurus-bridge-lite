[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentaurus-bridge-lite"
version = "0.2.1"
description = "Editor-independent CLI and MCP bridge for remote Sentaurus TCAD, AI agents, jobs, and VM desktop visualization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "sentaurus-bridge-lite contributors"}
]
keywords = ["sentaurus", "tcad", "mcp", "codex", "ssh", "eda", "codebuddy", "kimi-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
sentaurus-bridge = "sentaurus_bridge.cli:main"
sbridge = "sentaurus_bridge.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
dev = [
    "pytest>=7",
    "mcp>=1.26,<2",
    "tomli>=2; python_version < '3.11'",
    "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentaurus_bridge = ["resources/.env.example", "resources/remote_worker.py"]

[project.urls]
Homepage = "https://github.com/jianshengchuanchaun/sentaurus-bridge-lite"
Issues = "https://github.com/jianshengchuanchaun/sentaurus-bridge-lite/issues"
